# Tham số trung tâm cho toàn bộ pipeline.
# Mọi script trong src/ phải đọc giá trị từ đây, không hardcode.

seed: 42

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  source_url: "https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip"
  download_date: "2026-10-26"

# Expanding observation history; decision dates below are exclusive feature ends.
windows:
  observation_start: "2009-12-01"

cleaning:
  exact_duplicate_policy: "retain"  # Primary analysis; Phase 4 sensitivity drops exact duplicates separately.
  drop_cancelled_invoices: true      # Invoice bắt đầu bằng "C"
  drop_missing_customer_id: true
  drop_non_positive_quantity: true
  drop_non_positive_price: true

robustness:
  duplicate_policy: "drop_exact_duplicates"

validation:
  method: "expanding_temporal_snapshots"
  train_decision_dates: ["2010-12-01", "2011-03-01"]
  validation_decision_date: "2011-06-01"
  # [2011-09-10, 2011-12-09): 90 complete days; exclude the partial last day.
  final_test_decision_date: "2011-09-10"
  outcome_horizon_days: 90
  n_bootstrap: 1000

model:
  classification_target: "repeat_purchase"
  regression_target: "future_gross_sales"  # positive sales, NOT net returns/profit/CLV

# Phase 3 benchmark settings. Selection is validation-only; the Phase 1/2
# business source remains independently frozen under decision below.
advanced_modeling:
  classification_min_pr_auc_gain: 0.01
  classification_max_brier_increase: 0.005
  regression_min_relative_mae_gain: 0.05
  regression_max_p90_error_increase: 0.05
  calibration_min_brier_gain: 0.002
  calibration_max_pr_auc_loss: 0.005
  calibration_bins: 10
  attribution_sample_size: 750
  rolling_origin_dates:
    - "2010-06-01"
    - "2010-09-01"
    - "2010-12-01"
    - "2011-03-01"
    - "2011-06-01"
    - "2011-09-10"

decision:
  value_prediction_source: "baseline"  # baseline or advanced; choose before final test
  # baseline_future_revenue = clipped predicted future gross sales under historical
  # behavior, NOT an identified no-promotion counterfactual.
  # response_rate means assumed proportional growth in pre-discount sales volume,
  # NOT response probability or an estimated causal effect. Loyal multiplier = 1.
  discount_response_scenarios:
    - name: "conservative"
      discount_pct: 0.05
      response_rate: 0.10
    - name: "moderate"
      discount_pct: 0.10
      response_rate: 0.20
    - name: "aggressive"
      discount_pct: 0.20
      response_rate: 0.35
  reference_scenario: "moderate"   # scenario dùng làm baseline cho recommendation/tornado chart

  # gross_margin_rate g: baseline COGS = v*(1-g). Unit product costs stay fixed.
  # discount_rate d = discount_pct; growth r = response_rate * segment multiplier.
  # gross incremental margin = v*((1+r)*(g-d)-g); net = gross - contact cost.
  gross_margin_pct: 0.40

  # Scenario assumptions only; RFM does not identify treatment-response types.
  segment_response_multiplier:
    Champions: 0.5
    Loyal: 1.0
    At-risk: 1.3
    Lost: 0.4

  # campaign_budget = budget_total: CONTACT budget only. Discounts enter profit.
  # Same K=min(floor(budget/contact cost), population): Random/RFM use K; proposed uses <=K.
  contact_cost_per_customer: 0.50
  budget_total: 750.0
  # Exploratory analysis settings; original scenarios and economic assumptions stay fixed.
  random_policy_simulations: 1000
  sensitivity_grid:
    discount_pct: [0.05, 0.10, 0.15, 0.20]
    response_rate: [0.10, 0.20, 0.30, 0.40, 0.50]
